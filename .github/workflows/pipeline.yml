name: Dev Pipeline

on:
  push:
    branches:
      - dev        # only run on dev branch
  pull_request:
    branches:
      - dev        # also runs on PRs from dev

jobs:
  unit-test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt || true

      - name: Run unit tests
        run: python3 -m unittest

  create-merge-request:
    runs-on: ubuntu-latest
    needs: unit-test-job    # only runs if tests succeed
    if: github.ref == 'refs/heads/dev'   # only run on dev branch
    steps:
      - name: Create merge request
        run: |
          curl --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/pulls" \
            --header "Authorization: token ${{ secrets.API_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{
              \"title\": \"Auto merge dev to main\",
              \"head\": \"dev\",
              \"base\": \"main\"
            }"